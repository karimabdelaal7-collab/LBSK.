<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">المنتج | LBSK</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">
            <a href="index.html"><img src="logo/logo.png" alt="LBSK Logo"></a>
        </div>

        <nav>
            <a href="index.html" data-ar="الرئيسية" data-en="Home">الرئيسية</a>
            <a href="home.html" data-ar="بيتي" data-en="Homewear">بيتي</a>
            <a href="#" data-ar="كاجوال" data-en="Casual">كاجوال</a>
            <a href="#" data-ar="لانجري" data-en="Lingerie">لانجري</a>
            <a href="#" data-ar="العروض" data-en="Offers">العروض</a>
            <a href="#" data-ar="من نحن" data-en="About Us">من نحن</a>
            <a href="#" data-ar="تواصل معنا" data-en="Contact Us">تواصل معنا</a>
        </nav>

        <div class="header-actions">
            <div class="header-icons">
                <button aria-label="بحث" data-ar-label="بحث" data-en-label="Search">🔍</button>
                <button id="cartBtn" aria-label="سلة التسوق" data-ar-label="سلة التسوق" data-en-label="Cart">
                    🛒 <span id="cartCount" class="cart-count">0</span>
                </button>
            </div>
            <button id="langToggle" class="lang-btn" data-ar="EN" data-en="AR">EN</button>
        </div>
    </header>

    <section class="product-detail" id="productDetail">
        <!-- يتم تعبئته تلقائيًا بالجافاسكريبت -->
    </section>

    <!-- ===== لوحة السلة الجانبية ===== -->
    <div id="cartOverlay" class="cart-overlay"></div>
    <aside id="cartPanel" class="cart-panel">
        <div class="cart-header">
            <h3 data-ar="سلة التسوق" data-en="Your Cart">سلة التسوق</h3>
            <button id="closeCart" class="close-cart">&times;</button>
        </div>
        <div id="cartItems" class="cart-items">
            <p class="cart-empty" data-ar="السلة فارغة" data-en="Your cart is empty">السلة فارغة</p>
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span data-ar="الإجمالي" data-en="Total">الإجمالي</span>
                <span id="cartTotal">0 <span data-ar="ج.م" data-en="EGP">ج.م</span></span>
            </div>
            <a href="#" class="btn cart-checkout" data-ar="إتمام الطلب" data-en="Checkout">إتمام الطلب</a>
        </div>
    </aside>

    <footer>
        <p data-ar="© 2026 LBSK - جميع الحقوق محفوظة" data-en="© 2026 LBSK - All Rights Reserved">© 2026 LBSK - جميع الحقوق محفوظة</p>
    </footer>

    <script src="products-home.js"></script>
    <script src="main.js"></script>
    <script src="product.js"></script>
</body>

</html>
